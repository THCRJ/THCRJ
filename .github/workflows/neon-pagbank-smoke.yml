name: Neon Play - PagBank Sandbox smoke test
on:
  push:
    branches: [neon-play-teste]
    paths:
      - .github/workflows/neon-pagbank-smoke.yml
      - neon-wallet.js
  workflow_dispatch:

jobs:
  pagbank_sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Conferir API PagBank apenas sandbox, cotação e segurança
        env:
          API_PAGBANK: https://plcyaarsfzmjoqkbqlid.supabase.co/functions/v1/neon-pagbank-sandbox
          API_WALLET: https://plcyaarsfzmjoqkbqlid.supabase.co/functions/v1/neon-wallet-demo
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          pb=os.environ['API_PAGBANK']
          w=os.environ['API_WALLET']
          def call(url,body=None,expect_error=False):
              req=urllib.request.Request(url,method='POST' if body is not None else 'GET',
                  data=None if body is None else json.dumps(body).encode(),
                  headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=22) as response:
                      value=json.loads(response.read())
                      assert not expect_error, 'Era para falhar'
                      assert value.get('ok'),value
                      return value
              except urllib.error.HTTPError as err:
                  value=json.loads(err.read())
                  if expect_error:
                      assert err.code in (400,401,429,503) and 'error' in value,(err.code,value)
                      return value
                  raise
          health=call(pb)
          assert health['provider']=='PagBank' and health['environment']=='sandbox'
          assert health['real_pix_enabled'] is False and health['payouts_enabled'] is False
          print('PAGBANK SANDBOX:',health['environment'],'READY:',health['sandbox_ready'])
          call(pb,{'action':'quote','wallet_id':'00000000-0000-0000-0000-000000000001',
                   'wallet_token':'invalid-token-at-least-thirty-chars-123'},expect_error=True)
          a=call(w,{'action':'bootstrap','label':'QA_PAGBANK_WALLET_1122'})
          id=a['auth']['id'];token=a['auth']['token']
          print('PAGBANK_QA_WALLET:',id)
          credentials={'wallet_id':id,'wallet_token':token}
          quote=call(pb,{'action':'quote',**credentials,'cents':10})
          assert quote['credits_demo']==10 and quote['real_pix_enabled'] is False
          assert call(pb,{'action':'history',**credentials})['orders']==[]
          call(pb,{'action':'create_test_pix',**credentials,'cents':5},expect_error=True)
          if not health['sandbox_ready']:
              denied=call(pb,{'action':'create_test_pix',**credentials,'cents':10},expect_error=True)
              assert 'Sandbox' in denied['error'] or 'configurado' in denied['error']
          wallet=call(w,{'action':'state',**{'id':id,'token':token}})
          assert wallet['account']['balance_credits']==0 and len(wallet['history'])==0
          print('TESTE FINAL PAGBANK: status, autenticacao, cotacao, bloqueio, saldo e sem Pix real OK')
          PY