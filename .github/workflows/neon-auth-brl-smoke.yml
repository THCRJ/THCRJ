name: Neon Play - Login Google e Carteira BRL
on:
  push:
    branches: [neon-play-teste]
    paths:
      - index.html
      - neon-auth-app.js
      - neon-race-3d.js
      - .github/workflows/neon-auth-brl-smoke.yml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe JavaScript
        run: |
          node --check neon-auth-app.js
          node --check neon-race-3d.js
      - name: Conferir login e ausência de pagamentos ativos
        run: |
          python3 - <<'PY'
          import pathlib,re
          html=pathlib.Path('index.html').read_text()
          js=pathlib.Path('neon-auth-app.js').read_text()
          assert 'Continuar com Google' in html
          assert "signInWithOAuth({provider:'google'" in js
          assert "app_metadata?.provider==='google'" in js
          assert 'neon_real_wallet_accounts' in js
          assert 'PagBank' in html
          assert 'Mercado Pago' not in html
          assert 'neon-wallet.js' not in html and 'neon-damas.js' not in html
          assert 'neon-pix-preview' not in html
          assert not re.search(r'comprar cr[eé]dito|vender cr[eé]dito|resgatar b[oô]nus',html,re.I)
          assert 'disabled type="button"' in html
          assert 'sandbox.api.pagseguro.com' not in html+js
          print('Front-end: Google-only, BRL, PagBank, sem créditos negociáveis nem dinheiro ativo')
          PY
      - name: Conferir CDN de autenticação e prévia online
        run: |
          python3 - <<'PY'
          import urllib.request
          urls={
            'Supabase JS SDK':'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js',
            'Prévia Neon Play':'https://raw.githack.com/THCRJ/THCRJ/neon-play-teste/index.html'
          }
          for name,url in urls.items():
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=25) as response:
                  prefix=response.read(128000)
                  print(name,'HTTP',response.status,'bytes',len(prefix))
                  assert response.status==200
                  assert b'NEON' in prefix if name=='Prévia Neon Play' else len(prefix)>30000
          PY
      - name: Verificar bloqueio dos serviços antigos e status Google OAuth
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          root='https://plcyaarsfzmjoqkbqlid.supabase.co'
          for slug in ('neon-wallet-demo','neon-damas'):
              try:
                  urllib.request.urlopen(root+'/functions/v1/'+slug,timeout=20)
                  raise AssertionError(slug+' deveria estar desligado')
              except urllib.error.HTTPError as e:
                  assert e.code==410,(slug,e.code)
                  print(slug,'desativado (HTTP 410)')
          key='sb_publishable_WDGTdqGJnGQqhkTo6jYw2g_Ic-EIc7a'
          req=urllib.request.Request(root+'/auth/v1/settings',headers={'apikey':key})
          with urllib.request.urlopen(req,timeout=20) as resp:
              settings=json.loads(resp.read())
          print('GOOGLE_OAUTH_ENABLED:',settings.get('external',{}).get('google','não informado'))
          print('Testes básicos da migração concluídos')
          PY