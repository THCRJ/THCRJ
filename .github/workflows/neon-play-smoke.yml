name: Neon Play - smoke test
on:
  push:
    branches:
      - neon-play-teste
    paths:
      - .github/workflows/neon-play-smoke.yml
      - index.html
      - neon-damas.js
  workflow_dispatch:

jobs:
  test_connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir GET, CORS e RPC do servidor de damas
        shell: bash
        env:
          API_URL: https://plcyaarsfzmjoqkbqlid.supabase.co/functions/v1/neon-damas
        run: |
          set -euo pipefail
          code=$(curl --retry 3 --retry-delay 2 -sS --max-time 20 -o /tmp/neon-health.json -w "%{http_code}" "$API_URL")
          echo "GET HTTP: $code"
          test "$code" = "200"
          python3 -c 'import json; x=json.load(open("/tmp/neon-health.json")); assert x.get("ok") and x.get("game")=="neon-damas"'
          code=$(curl -sS --max-time 20 -X OPTIONS -o /tmp/neon-options.txt -D /tmp/neon-options-headers.txt -w "%{http_code}" "$API_URL" -H "Origin: https://raw.githack.com" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type")
          echo "OPTIONS HTTP: $code"
          test "$code" = "204"
          grep -iq 'access-control-allow-origin: \*' /tmp/neon-options-headers.txt
          code=$(curl -sS --max-time 20 -o /tmp/neon-action.json -w "%{http_code}" "$API_URL" -X POST -H "Content-Type: application/json" --data '{"action":"state","id":"00000000-0000-0000-0000-000000000001","token":"01234567890123456789012345"}')
          echo "POST estado sem sessao HTTP: $code"
          test "$code" = "400"
          python3 -c 'import json; x=json.load(open("/tmp/neon-action.json")); assert "error" in x'
          echo "Neon Play: GET/CORS e RPC responderam normalmente."
      - name: Testar ofertas livres, aceite manual, movimentos e pagamento
        shell: bash
        env:
          API_URL: https://plcyaarsfzmjoqkbqlid.supabase.co/functions/v1/neon-damas
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          api = os.environ['API_URL']
          def call(action, player=None, expect_error=False, **kwargs):
              body={"action":action, **(player or {}), **kwargs}
              req=urllib.request.Request(api,method="POST",data=json.dumps(body).encode(),headers={"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=25) as resp:
                      data=json.loads(resp.read())
                  assert not expect_error, f"Ação {action} era para falhar"
                  assert data.get("ok") is True, f"{action}: {data}"
                  return data
              except urllib.error.HTTPError as e:
                  data=json.loads(e.read())
                  if expect_error:
                      assert e.code in (400,401), f"Erro inesperado {e.code}: {data}"
                      return data
                  raise AssertionError(f"{action} HTTP {e.code}: {data}")
          a=call("bootstrap",nickname="QA_OPEN_A_1122")
          b=call("bootstrap",nickname="QA_OPEN_B_1122")
          c=call("bootstrap",nickname="QA_OPEN_C_1122")
          aa,bb,cc=a["auth"],b["auth"],c["auth"]
          print("TEST ACCOUNTS:",aa["id"],bb["id"],cc["id"])
          for user in (a,b,c):
              assert user["player"]["balance"]==50000, "saldo inicial incorreto"
          # Dois desafios iguais não devem iniciar partida automaticamente.
          qa=call("offer",aa,stake=735)
          qb=call("offer",bb,stake=735)
          assert qa["queue"]["stake"]==735 and qa["game"] is None
          assert qb["queue"]["stake"]==735 and qb["game"] is None
          # Todos veem as ofertas e escolhem voluntariamente.
          import time
          print("Validando persistência após 66 segundos sem atividade dos criadores...")
          time.sleep(66)
          offers=call("state",cc)["offers"]
          assert {x["player_id"] for x in offers}.issuperset({aa["id"],bb["id"]}), offers
          accepted=call("accept",bb,target=aa["id"])
          assert accepted["game"]["status"]=="active"
          assert accepted["game"]["stake"]==735
          assert accepted["player"]["balance"]==49265
          assert accepted["queue"] is None
          creator=call("state",aa)
          assert creator["game"]["status"]=="active" and creator["player"]["balance"]==49265
          third=call("state",cc)
          assert not any(x["player_id"]==aa["id"] for x in third["offers"]), third["offers"]
          call("accept",cc,target=aa["id"],expect_error=True)
          assert call("state",cc)["player"]["balance"]==50000
          # Movimento, desistência e liquidação.
          assert call("move",aa,**{"from":40,"to":33})["game"]["turn"]=="b"
          assert call("move",bb,**{"from":17,"to":24})["game"]["turn"]=="w"
          assert call("resign",bb)["game"]["status"]=="finished"
          settled=call("state",aa)
          assert settled["game"]["winner_id"]==aa["id"]
          assert settled["player"]["balance"]==50735
          assert call("state",bb)["player"]["balance"]==49265
          # Valor diferente e cancelamento voluntário.
          open2=call("offer",cc,stake=1234)
          assert open2["queue"]["stake"]==1234
          call("leave",bb)
          assert any(x["stake"]==1234 and x["player_id"]==cc["id"] for x in call("state",bb)["offers"])
          cancelled=call("cancel",cc)
          assert cancelled["queue"] is None
          assert not any(x["player_id"]==cc["id"] for x in call("state",bb)["offers"])
          print("TESTE FINAL: desafio livre, listagem, aceite, disputa e premiação APROVADOS")
          PY
