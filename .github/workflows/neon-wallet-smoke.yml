name: Neon Play — carteira demo smoke test
on:
  push:
    branches: [neon-play-teste]
    paths:
      - .github/workflows/neon-wallet-smoke.yml
      - neon-wallet.js
      - index.html
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar carteira, compra, venda e histórico sem dinheiro real
        shell: bash
        env:
          WALLET_URL: https://plcyaarsfzmjoqkbqlid.supabase.co/functions/v1/neon-wallet-demo
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,os
          endpoint=os.environ["WALLET_URL"]
          with urllib.request.urlopen(endpoint,timeout=20) as resp:
              info=json.loads(resp.read())
          assert info["ok"] and info["mode"]=="simulacao"
          assert info["pix_enabled"] is False and info["payout_enabled"] is False
          def call(action,auth=None,expect_error=False,**kwargs):
              data=json.dumps({"action":action,**(auth or {}),**kwargs}).encode()
              req=urllib.request.Request(endpoint,method="POST",data=data,headers={"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as resp:
                      ans=json.loads(resp.read())
                  assert not expect_error, f"Operação {action} deveria falhar"
                  assert ans.get("ok") is True, f"Operação {action} não retornou OK: {ans}"
                  return ans
              except urllib.error.HTTPError as error:
                  ans=json.loads(error.read())
                  if expect_error:
                      assert error.code in [400,401] and "error" in ans,(error.code,ans)
                      return ans
                  raise AssertionError(f"Operação {action} falhou: {error.code}: {ans}")
          a=call("bootstrap",label="QA_WALLET_NEON_1122")
          auth=a["auth"]
          print("WALLET_TEST_ACCOUNT:",auth["id"])
          assert a["account"]["balance_credits"]==0
          assert a["history"]==[]
          buy=call("buy_demo",auth,credits=10)
          assert buy["account"]["balance_credits"]==10
          assert buy["history"][0]["direction"]=="buy_demo"
          assert buy["history"][0]["brl_cents"]==10
          sell=call("sell_demo",auth,credits=3)
          assert sell["account"]["balance_credits"]==7
          assert sell["history"][0]["direction"]=="sell_demo"
          assert sell["history"][0]["brl_cents"]==3
          call("sell_demo",auth,credits=8,expect_error=True)
          last=call("state",auth)
          assert last["account"]["balance_credits"]==7
          assert len(last["history"])==2
          assert last["pix_enabled"] is False and last["payout_enabled"] is False
          print("CARTEIRA DEMO: compra, venda, saldo, histórico e segurança contra saldo negativo OK")
          PY